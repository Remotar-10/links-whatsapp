<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links do WhatsApp</title>
</head>
<body>
  <h1>Links da conversa</h1>

  <input id="arquivo" type="file" accept=".txt,text/plain">
  <p id="contagem">Carregando links salvos...</p>
  <button id="apagar" type="button">Apagar todos os links</button>
  <ul id="links"></ul>

  <script>
    const chave = "links-whatsapp-salvos";
    const entrada = document.querySelector("#arquivo");
    const lista = document.querySelector("#links");
    const contagem = document.querySelector("#contagem");
    const botaoApagar = document.querySelector("#apagar");

    let linksSalvos = JSON.parse(localStorage.getItem(chave) || "[]");

    function mostrarLinks() {
      lista.replaceChildren();

      for (const url of linksSalvos) {
        const item = document.createElement("li");
        const link = document.createElement("a");

        link.href = url;
        link.textContent = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        item.append(link);
        lista.append(item);
      }

      const quantidade = linksSalvos.length;
      contagem.textContent =
        `${quantidade} link${quantidade === 1 ? "" : "s"} salvo${quantidade === 1 ? "" : "s"}.`;
    }

    entrada.addEventListener("change", async () => {
      const arquivo = entrada.files[0];
      if (!arquivo) return;

      const texto = await arquivo.text();
      const encontrados = texto.match(/https?:\/\/[^\s<>"']+/gi) || [];

      for (const trecho of encontrados) {
        const semPontuacao = trecho.replace(/[),.;!?]+$/, "");

        try {
          const endereco = new URL(semPontuacao);
          if (endereco.protocol === "http:" || endereco.protocol === "https:") {
            linksSalvos.push(endereco.href);
          }
        } catch {
          // Ignora links inválidos.
        }
      }

      linksSalvos = [...new Set(linksSalvos)];
      localStorage.setItem(chave, JSON.stringify(linksSalvos));
      mostrarLinks();

      // Permite selecionar o mesmo arquivo novamente.
      entrada.value = "";
    });

    botaoApagar.addEventListener("click", () => {
      linksSalvos = [];
      localStorage.removeItem(chave);
      mostrarLinks();
    });

    mostrarLinks();
  </script>
</body>
</html>
