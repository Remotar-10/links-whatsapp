<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links do WhatsApp</title>

    <style>
        :root {
            --primary: #128C7E;
            --primary-light: #25D366;
            --background: #f0f2f5;
            --surface: #fff;
            --text: #263238;
            --muted: #687780;
            --border: #e0e0e0;
            --danger: #c62828;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 20px;
            color: var(--primary);
            text-align: center;
        }

        .panel {
            margin-bottom: 18px;
            padding: 18px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 10px rgb(0 0 0 / 7%);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        button,
        .file-label {
            min-height: 40px;
            padding: 10px 14px;
            border: 0;
            border-radius: 7px;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            text-align: center;
        }

        button:hover,
        .file-label:hover {
            opacity: .88;
        }

        button.secondary,
        .file-label.secondary {
            background: #607d8b;
        }

        button.danger {
            background: var(--danger);
        }

        input[type="file"] {
            display: none;
        }

        .search {
            width: 100%;
            min-height: 44px;
            margin-bottom: 14px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font: inherit;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-chip {
            min-height: auto;
            padding: 7px 12px;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            border-radius: 20px;
            font-size: 14px;
        }

        .filter-chip.active {
            background: var(--primary);
            color: #fff;
        }

        .sort-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 14px;
        }

        .sort-row select {
            padding: 7px 9px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            color: var(--text);
            font: inherit;
        }

        #linkContainer {
            padding: 0;
            overflow: hidden;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .link-item:last-child {
            border-bottom: 0;
        }

        .link-content {
            min-width: 0;
            flex: 1;
        }

        .link-url {
            display: block;
            overflow: hidden;
            color: #075eaa;
            font-size: 15px;
            text-decoration: none;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .link-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }

        .meta-tag {
            max-width: 100%;
            padding: 3px 7px;
            overflow: hidden;
            border-radius: 5px;
            background: #eef2f3;
            color: var(--muted);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-actions {
            display: flex;
            flex-shrink: 0;
            gap: 5px;
        }

        .action-btn {
            min-height: 36px;
            padding: 5px 8px;
            background: transparent;
            color: var(--muted);
            font-size: 18px;
        }

        .action-btn.favorite.active {
            color: #e3a500;
        }

        .empty-state {
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        .toast {
            position: fixed;
            z-index: 10;
            bottom: 20px;
            left: 50%;
            display: none;
            max-width: calc(100% - 32px);
            padding: 12px 16px;
            transform: translateX(-50%);
            border-radius: 7px;
            background: #263238;
            color: white;
            box-shadow: 0 3px 12px rgb(0 0 0 / 20%);
        }

        .toast button {
            min-height: auto;
            margin-left: 8px;
            padding: 0;
            background: none;
            color: #9ee7c1;
            text-decoration: underline;
        }

        @media (max-width: 560px) {
            body {
                padding: 16px 10px;
            }

            .panel {
                padding: 14px;
            }

            .link-item {
                padding: 12px 10px;
            }

            .toolbar > * {
                flex: 1 1 140px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Links do WhatsApp</h1>

        <section class="panel" aria-label="Importação, busca e filtros">
            <div class="toolbar">
                <label class="file-label">
                    Importar conversa .txt
                    <input id="txtInput" type="file" accept=".txt,text/plain">
                </label>

                <label class="file-label secondary">
                    Importar backup JSON
                    <input id="jsonInput" type="file" accept=".json,application/json">
                </label>

                <button id="exportButton" class="secondary" type="button">
                    Exportar backup JSON
                </button>

                <button id="clearButton" class="danger" type="button">
                    Apagar todos
                </button>
            </div>

            <input
                id="searchInput"
                class="search"
                type="search"
                placeholder="Buscar link ou conversa..."
                aria-label="Buscar links">

            <div class="filters" aria-label="Filtros de links">
                <button class="filter-chip active" type="button" data-filter="all">Todos</button>
                <button class="filter-chip" type="button" data-filter="fav">Favoritos</button>
                <button class="filter-chip" type="button" data-filter="unvisited">Não visitados</button>
                <button class="filter-chip" type="button" data-filter="repeated">Repetidos</button>
            </div>

            <div class="sort-row">
                <label for="sortSelect">Ordenar por:</label>
                <select id="sortSelect">
                    <option value="newest">Data mais recente</option>
                    <option value="oldest">Data mais antiga</option>
                    <option value="added">Adicionados recentemente</option>
                </select>
            </div>
        </section>

        <section id="linkContainer" class="panel" aria-live="polite"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        'use strict';

        const STORAGE_KEY = 'wa_links_data';

        let linksData = [];
        let currentFilter = 'all';
        let deletedItem = null;
        let toastTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderLinks();

            document.getElementById('searchInput')
                .addEventListener('input', renderLinks);

            document.getElementById('sortSelect')
                .addEventListener('change', renderLinks);

            document.getElementById('txtInput')
                .addEventListener('change', handleTxtImport);

            document.getElementById('jsonInput')
                .addEventListener('change', handleJsonImport);

            document.getElementById('exportButton')
                .addEventListener('click', exportJSON);

            document.getElementById('clearButton')
                .addEventListener('click', clearAllData);

            document.querySelectorAll('.filter-chip').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip')
                        .forEach(chip => chip.classList.remove('active'));

                    button.classList.add('active');
                    currentFilter = button.dataset.filter;
                    renderLinks();
                });
            });
        });

        function handleTxtImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = () => {
                try {
                    const content = String(reader.result || '');
                    const conversation = detectConversationName(content, file.name);
                    const newItems = extractLinks(content, conversation);

                    if (newItems.length === 0) {
                        showToast('Não encontrei links HTTP ou HTTPS nesse arquivo.');
                    } else {
                        mergeLinks(newItems);
                    }
                } catch (error) {
                    alert('Não foi possível importar o arquivo: ' + error.message);
                } finally {
                    event.target.value = '';
                }
            };

            reader.onerror = () => {
                alert('Não foi possível ler o arquivo .txt.');
                event.target.value = '';
            };

            reader.readAsText(file);
        }

        function detectConversationName(content, filename) {
            const fallback = filename.replace(/\.txt$/i, '').trim() || 'Conversa';
            const firstLines = content.split(/\r?\n/).slice(0, 10);

            for (const line of firstLines) {
                const patterns = [
                    /^(?:WhatsApp\s+)?Chat with\s+(.+?)\s*$/i,
                    /^Conversa com\s+(.+?)\s*$/i,
                    /^Chat de\s+(.+?)\s*$/i
                ];

                for (const pattern of patterns) {
                    const match = line.trim().match(pattern);
                    if (match) return match[1].trim();
                }
            }

            return fallback;
        }

        function extractLinks(content, conversation) {
            const lines = content.split(/\r?\n/);
            const items = [];
            const urlRegex = /https?:\/\/[^\s<>"']+/gi;

            for (const line of lines) {
                const messageDate = extractMessageDate(line);
                const matches = line.match(urlRegex) || [];

                for (const rawUrl of matches) {
                    const url = cleanUrl(rawUrl);
                    if (!isValidHttpUrl(url)) continue;

                    items.push({
                        id: createId(),
                        url,
                        conversation,
                        date: messageDate,
                        addedDate: new Date().toISOString(),
                        favorite: false,
                        visited: false,
                        tags: []
                    });
                }
            }

            return items;
        }

        function extractMessageDate(line) {
            // Aceita formatos comuns, por exemplo:
            // [16/10/26, 14:30:15] Nome: mensagem
            // 16/10/2026, 14:30 - Nome: mensagem
            // 16/10/26 14:30 - Nome: mensagem
            const match = line.match(
                /^\[?(\d{1,2}[/.]\d{1,2}[/.]\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*(?:[-–]\s*)?/
            );

            if (!match) return '';

            const datePart = match[1].replace(/\./g, '/');
            return `${datePart}, ${match[2]}`;
        }

        function cleanUrl(rawUrl) {
            return rawUrl.replace(/[.,!?;:)\]}]+$/g, '');
        }

        function isValidHttpUrl(value) {
            try {
                const parsed = new URL(value);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch {
                return false;
            }
        }

        function createId() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }

            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function normalizeItem(item) {
            if (typeof item === 'string') {
                if (!isValidHttpUrl(item)) return null;

                return {
                    id: createId(),
                    url: item,
                    conversation: 'Importado',
                    date: '',
                    addedDate: new Date().toISOString(),
                    favorite: false,
                    visited: false,
                    tags: []
                };
            }

            if (!item || typeof item !== 'object') return null;

            const url = String(item.url || item.link || '').trim();
            if (!isValidHttpUrl(url)) return null;

            return {
                id: String(item.id || createId()),
                url,
                conversation: String(item.conversation || item.chat || item.source || 'Importado'),
                date: String(item.date || item.messageDate || ''),
                addedDate: String(item.addedDate || item.createdAt || new Date().toISOString()),
                favorite: Boolean(item.favorite ?? item.fav),
                visited: Boolean(item.visited),
                tags: Array.isArray(item.tags) ? item.tags.map(String) : []
            };
        }

        function mergeLinks(newItems) {
            const existingKeys = new Set(
                linksData.map(item => makeDuplicateKey(item))
            );

            let addedCount = 0;

            for (const rawItem of newItems) {
                const item = normalizeItem(rawItem);
                if (!item) continue;

                const key = makeDuplicateKey(item);
                if (existingKeys.has(key)) continue;

                linksData.push(item);
                existingKeys.add(key);
                addedCount++;
            }

            saveToLocalStorage();
            renderLinks();
            showToast(`Importação concluída: ${addedCount} link(s) novo(s).`);
        }

        function makeDuplicateKey(item) {
            return `${String(item.url || '').trim().toLowerCase()}|${String(item.conversation || '').trim().toLowerCase()}`;
        }

        function handleJsonImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = () => {
                try {
                    const parsed = JSON.parse(String(reader.result || ''));
                    const importedItems = findItemsArray(parsed)
                        .map(normalizeItem)
                        .filter(Boolean);

                    if (importedItems.length === 0) {
                        throw new Error('O JSON não contém uma lista válida de links.');
                    }

                    const merge = confirm(
                        'Clique em OK para mesclar com os dados existentes. ' +
                        'Clique em Cancelar para substituir todos os dados.'
                    );

                    if (merge) {
                        mergeLinks(importedItems);
                    } else {
                        linksData = removeDuplicates(importedItems);
                        saveToLocalStorage();
                        renderLinks();
                        showToast('Dados substituídos.');
                    }
                } catch (error) {
                    alert('Erro ao importar JSON: ' + error.message);
                } finally {
                    event.target.value = '';
                }
            };

            reader.onerror = () => {
                alert('Não foi possível ler o arquivo JSON.');
                event.target.value = '';
            };

            reader.readAsText(file);
        }

        function findItemsArray(parsed) {
            if (Array.isArray(parsed)) return parsed;

            if (!parsed || typeof parsed !== 'object') return [];

            for (const key of ['links', 'items', 'data']) {
                if (Array.isArray(parsed[key])) return parsed[key];
            }

            return [];
        }

        function removeDuplicates(items) {
            const seen = new Set();

            return items.filter(item => {
                const key = makeDuplicateKey(item);
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function exportJSON() {
            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                links: linksData
            };

            const blob = new Blob(
                [JSON.stringify(data, null, 2)],
                { type: 'application/json' }
            );

            const objectUrl = URL.createObjectURL(blob);
            const anchor = document.createElement('a');

            anchor.href = objectUrl;
            anchor.download = `whatsapp-links-${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();

            URL.revokeObjectURL(objectUrl);
        }

        function renderLinks() {
            const container = document.getElementById('linkContainer');
            const searchTerm = document.getElementById('searchInput')
                .value.trim().toLowerCase();
            const sortOrder = document.getElementById('sortSelect').value;

            const urlCounts = new Map();

            for (const item of linksData) {
                const key = String(item.url || '').toLowerCase();
                urlCounts.set(key, (urlCounts.get(key) || 0) + 1);
            }

            const filtered = linksData
                .filter(item => {
                    const url = String(item.url || '');
                    const conversation = String(item.conversation || '');
                    const tags = Array.isArray(item.tags) ? item.tags.join(' ') : '';

                    const matchesSearch =
                        url.toLowerCase().includes(searchTerm) ||
                        conversation.toLowerCase().includes(searchTerm) ||
                        tags.toLowerCase().includes(searchTerm);

                    if (!matchesSearch) return false;
                    if (currentFilter === 'fav') return Boolean(item.favorite);
                    if (currentFilter === 'unvisited') return !item.visited;

                    if (currentFilter === 'repeated') {
                        return (urlCounts.get(url.toLowerCase()) || 0) > 1;
                    }

                    return true;
                })
                .sort((a, b) => compareItems(a, b, sortOrder));

            container.replaceChildren();

            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'Nenhum link encontrado.';
                container.appendChild(empty);
                return;
            }

            for (const item of filtered) {
                container.appendChild(createLinkElement(item));
            }
        }

        function compareItems(a, b, sortOrder) {
            if (sortOrder === 'added') {
                return (parseDateValue(b.addedDate) || 0) -
                    (parseDateValue(a.addedDate) || 0);
            }

            const dateA = parseMessageDate(a.date);
            const dateB = parseMessageDate(b.date);

            if (dateA === null && dateB === null) return 0;
            if (dateA === null) return 1;
            if (dateB === null) return -1;

            return sortOrder === 'oldest' ? dateA - dateB : dateB - dateA;
        }

        function parseMessageDate(value) {
            if (!value || /desconhecida|s\/d/i.test(String(value))) return null;

            const text = String(value).trim();
            const match = text.match(
                /^(\d{1,2})[/.](\d{1,2})[/.](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/
            );

            if (!match) {
                const timestamp = Date.parse(text);
                return Number.isNaN(timestamp) ? null : timestamp;
            }

            const day = Number(match[1]);
            const month = Number(match[2]);
            let year = Number(match[3]);
            const hour = Number(match[4]);
            const minute = Number(match[5]);
            const second = Number(match[6] || 0);

            if (year < 100) year += year < 50 ? 2000 : 1900;

            const date = new Date(year, month - 1, day, hour, minute, second);

            // Evita aceitar datas inválidas, como 32/13/26.
            if (
                date.getFullYear() !== year ||
                date.getMonth() !== month - 1 ||
                date.getDate() !== day
            ) {
                return null;
            }

            return date.getTime();
        }

        function parseDateValue(value) {
            if (!value) return null;
            const timestamp = Date.parse(value);
            return Number.isNaN(timestamp) ? null : timestamp;
        }

        function createLinkElement(item) {
            const row = document.createElement('article');
            row.className = 'link-item';

            const content = document.createElement('div');
            content.className = 'link-content';

            const anchor = document.createElement('a');
            anchor.className = 'link-url';
            anchor.href = item.url;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            anchor.textContent = item.url;
            anchor.title = item.url;
            anchor.addEventListener('click', () => markVisited(item.id));

            const meta = document.createElement('div');
            meta.className = 'link-meta';

            const conversation = document.createElement('span');
            conversation.className = 'meta-tag';
            conversation.textContent = `💬 ${item.conversation || 'Conversa desconhecida'}`;

            const date = document.createElement('span');
            date.className = 'meta-tag';
            date.textContent = `📅 ${formatDisplayDate(item.date)}`;

            meta.append(conversation, date);

            if (Array.isArray(item.tags)) {
                for (const tagText of item.tags) {
                    const tag = document.createElement('span');
                    tag.className = 'meta-tag';
                    tag.textContent = `# ${tagText}`;
                    meta.appendChild(tag);
                }
            }

            content.append(anchor, meta);

            const actions = document.createElement('div');
            actions.className = 'link-actions';

            const favorite = document.createElement('button');
            favorite.type = 'button';
            favorite.className = `action-btn favorite${item.favorite ? ' active' : ''}`;
            favorite.textContent = '★';
            favorite.title = item.favorite ? 'Remover dos favoritos' : 'Adicionar aos favoritos';
            favorite.setAttribute('aria-label', favorite.title);
            favorite.addEventListener('click', () => toggleFavorite(item.id));

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'action-btn';
            remove.textContent = '🗑';
            remove.title = 'Remover link';
            remove.setAttribute('aria-label', 'Remover link');
            remove.addEventListener('click', () => removeLink(item.id));

            actions.append(favorite, remove);
            row.append(content, actions);

            return row;
        }

        function formatDisplayDate(value) {
            if (!value) return 'Data desconhecida';

            const timestamp = parseMessageDate(value);
            if (timestamp === null) return value;

            return new Intl.DateTimeFormat('pt-BR', {
                dateStyle: 'short',
                timeStyle: 'short'
            }).format(new Date(timestamp));
        }

        function toggleFavorite(id) {
            const item = linksData.find(link => link.id === id);
            if (!item) return;

            item.favorite = !item.favorite;
            saveToLocalStorage();
            renderLinks();
        }

        function markVisited(id) {
            const item = linksData.find(link => link.id === id);
            if (!item) return;

            item.visited = true;
            saveToLocalStorage();
        }

        function removeLink(id) {
            const index = linksData.findIndex(link => link.id === id);
            if (index === -1) return;

            deletedItem = {
                item: linksData[index],
                index
            };

            linksData.splice(index, 1);
            saveToLocalStorage();
            renderLinks();
            showUndoToast();
        }

        function undoDelete() {
            if (!deletedItem) return;

            const index = Math.min(deletedItem.index, linksData.length);
            linksData.splice(index, 0, deletedItem.item);
            deletedItem = null;

            saveToLocalStorage();
            renderLinks();
            showToast('Link restaurado.');
        }

        function clearAllData() {
            if (!confirm('Apagar todos os links salvos neste navegador?')) return;

            linksData = [];
            deletedItem = null;
            saveToLocalStorage();
            renderLinks();
            showToast('Todos os links foram apagados.');
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(linksData));
                return true;
            } catch (error) {
                console.error('Erro ao salvar no armazenamento local:', error);

                if (error && (
                    error.name === 'QuotaExceededError' ||
                    error.name === 'NS_ERROR_DOM_QUOTA_REACHED'
                )) {
                    alert('O armazenamento do navegador está cheio. Exporte um backup e remova alguns links.');
                } else {
                    alert('Não foi possível salvar os dados no armazenamento do navegador.');
                }

                return false;
            }
        }

        function loadFromLocalStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) {
                    linksData = [];
                    return;
                }

                const parsed = JSON.parse(stored);
                linksData = Array.isArray(parsed)
                    ? parsed.map(normalizeItem).filter(Boolean)
                    : [];
            } catch (error) {
                console.error('Erro ao carregar os dados:', error);
                linksData = [];
                alert('Não foi possível ler os dados salvos neste navegador.');
            }
        }

        function showUndoToast() {
            const toast = document.getElementById('toast');
            toast.replaceChildren();
            toast.appendChild(document.createTextNode('Link removido. '));

            const undoButton = document.createElement('button');
            undoButton.type = 'button';
            undoButton.textContent = 'Desfazer';
            undoButton.addEventListener('click', undoDelete, { once: true });

            toast.appendChild(undoButton);
            showToastElement(toast);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            showToastElement(toast);
        }

        function showToastElement(toast) {
            toast.style.display = 'block';
            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
