<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links do WhatsApp</title>

  <style>
    :root {
      color-scheme: light;
      --green: #087e68;
      --green-dark: #075e4d;
      --page: #f2f5f4;
      --card: #fff;
      --text: #202a27;
      --muted: #66736f;
      --border: #dce5e1;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px 48px;
      background: var(--page);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: min(900px, 100%);
      margin: auto;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.5rem;
    }

    .toolbar, .filters, .sort-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .panel, .link-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 9px rgba(25, 50, 42, .05);
    }

    .panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    button, .file-label {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--green);
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover, .file-label:hover { background: var(--green-dark); }

    button.secondary {
      background: #e6efeb;
      color: var(--text);
    }

    button.secondary:hover { background: #d8e6e0; }

    button.danger { background: var(--danger); }

    button:disabled { opacity: .55; cursor: not-allowed; }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .search {
      width: 100%;
      margin: 14px 0 10px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
    }

    .filters { margin: 8px 0 14px; }

    .filter-button {
      padding: 7px 12px;
      border: 1px solid var(--green);
      border-radius: 20px;
      background: white;
      color: var(--green-dark);
    }

    .filter-button.active {
      background: var(--green);
      color: white;
    }

    .sort-row {
      color: var(--muted);
      font-size: .92rem;
    }

    select {
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      font: inherit;
    }

    #status {
      min-height: 1.4em;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    #links {
      display: grid;
      gap: 10px;
    }

    .link-card {
      padding: 14px 16px;
      overflow-wrap: anywhere;
    }

    .link-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .domain-link {
      color: var(--green-dark);
      font-weight: 650;
      text-decoration: none;
    }

    .domain-link:hover { text-decoration: underline; }

    .conversation, .date, .full-url {
      color: var(--muted);
      font-size: .88rem;
    }

    .full-url {
      margin-top: 5px;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .actions button {
      padding: 6px 9px;
      font-size: .88rem;
    }

    .empty {
      padding: 25px 15px;
      color: var(--muted);
      text-align: center;
      background: white;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .undo-bar {
      display: none;
      position: fixed;
      z-index: 20;
      right: 16px;
      bottom: 16px;
      max-width: calc(100vw - 32px);
      padding: 12px 14px;
      color: white;
      background: #26332f;
      border-radius: 10px;
      box-shadow: 0 4px 18px #0003;
    }

    .undo-bar button {
      margin-left: 10px;
      padding: 6px 10px;
      background: #b8f0df;
      color: #173b30;
    }

    .link-hover-card {
      position: fixed;
      z-index: 9999;
      display: none;
      width: min(320px, calc(100vw - 24px));
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--green-dark);
      color: white;
      box-shadow: 0 8px 24px #0005;
      font: 14px/1.4 system-ui, sans-serif;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    .link-hover-card.visible { display: block; }

    .preview-domain {
      margin-bottom: 6px;
      font-weight: 700;
    }

    .preview-url {
      color: #d4f3e9;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      body { padding: 16px 10px 40px; }
      .panel { padding: 12px; }
      .link-top { display: block; }
      .actions { margin-top: 10px; }
    }
  </style>
</head>

<body>
<main>
  <h1>Links do WhatsApp</h1>

  <section class="panel">
    <div class="toolbar">
      <label class="file-label" for="txtFile">Importar conversa .txt</label>
      <input id="txtFile" type="file" accept=".txt,text/plain">

      <label class="file-label" for="jsonFile">Importar backup JSON</label>
      <input id="jsonFile" type="file" accept=".json,application/json">

      <button id="exportButton" type="button">Exportar backup JSON</button>
      <button id="clearButton" class="danger" type="button">Apagar todos</button>
    </div>

    <input id="search" class="search" type="search"
           placeholder="Buscar link ou conversa…">

    <div class="filters" aria-label="Filtrar links">
      <button class="filter-button active" data-filter="all">Todos</button>
      <button class="filter-button" data-filter="favorites">Favoritos</button>
      <button class="filter-button" data-filter="unvisited">Não visitados</button>
      <button class="filter-button" data-filter="repeated">Repetidos</button>
    </div>

    <div class="sort-row">
      <label for="conversationFilter">Conversa:</label>
      <select id="conversationFilter">
        <option value="">Todas as conversas</option>
      </select>

      <label for="sortOrder">Ordenar:</label>
      <select id="sortOrder">
        <option value="newest">Data mais recente</option>
        <option value="oldest">Data mais antiga</option>
        <option value="domain">Domínio</option>
      </select>
    </div>

    <p id="status" role="status"></p>
  </section>

  <section id="links" aria-live="polite"></section>
</main>

<div id="undoBar" class="undo-bar" role="status">
  Link removido.
  <button id="undoButton" type="button">Desfazer</button>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "whatsappLinksApp_v1";
  const linksElement = document.getElementById("links");
  const statusElement = document.getElementById("status");
  const searchElement = document.getElementById("search");
  const conversationFilter = document.getElementById("conversationFilter");
  const sortOrder = document.getElementById("sortOrder");
  const undoBar = document.getElementById("undoBar");
  let currentFilter = "all";
  let deletedLink = null;
  let undoTimer = null;

  function loadLinks() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return [];
      const parsed = JSON.parse(stored);
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      console.error("Não foi possível ler os dados salvos:", error);
      return [];
    }
  }

  let links = loadLinks();

  function saveLinks() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
      return true;
    } catch (error) {
      console.error("Erro ao salvar no localStorage:", error);
      setStatus(
        "Não foi possível salvar: o armazenamento do navegador pode estar cheio. " +
        "Exporte um backup e remova alguns links."
      );
      return false;
    }
  }

  function setStatus(message) {
    statusElement.textContent = message;
  }

  function makeId() {
    return (crypto.randomUUID && crypto.randomUUID()) ||
      `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function normalizeUrl(raw) {
    let url = raw.trim().replace(/[),.;!?]+$/g, "");
    try {
      const parsed = new URL(url);
      if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return null;
      return parsed.href;
    } catch {
      return null;
    }
  }

  function getDateFromLine(line) {
    const match = line.match(
      /^\[?(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\]?/
    );
    if (!match) return "";

    let [, day, month, year, hour, minute, second = "00"] = match;
    day = Number(day);
    month = Number(month);
    year = Number(year);
    if (year < 100) year += year >= 70 ? 1900 : 2000;

    const date = new Date(year, Number(month) - 1, day,
      Number(hour), Number(minute), Number(second));

    if (Number.isNaN(date.getTime())) return "";
    return date.toISOString();
  }

  function getConversationFromText(text, fallback) {
    const lines = text.split(/\r?\n/).slice(0, 30);

    for (const line of lines) {
      const match = line.match(/chat with\s+(.+)/i);
      if (match) return match[1].trim();
    }
    for (const line of lines) {
      const match = line.match(/group\s+(.+)/i);
      if (match) return match[1].trim();
    }
    return fallback || "Conversa sem nome";
  }

  function parseChatLine(line) {
    const date = getDateFromLine(line);
    let message = line;

    // Retira o prefixo de data/hora e, quando reconhecido, o nome do remetente.
    message = message.replace(
      /^\[?\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*/,
      ""
    );
    message = message.replace(
      /^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+\d{1,2}:\d{2}(?:\s*-\s*|\s+)/,
      ""
    );
    message = message.replace(/^[^:]{1,80}:\s*/, "");

    return { date, message };
  }

  function addChatText(text, filename) {
    const conversation = getConversationFromText(text, filename);
    const found = [];

    for (const line of text.split(/\r?\n/)) {
      const { date, message } = parseChatLine(line);
      const urlPattern = /https?:\/\/[^\s<>"']+/gi;
      let match;

      while ((match = urlPattern.exec(message)) !== null) {
        const url = normalizeUrl(match[0]);
        if (url) found.push({ url, date, conversation });
      }
    }

    const added = mergeLinks(found);
    setStatus(`Importação concluída: ${added} link(s) novo(s) encontrado(s).`);
    render();
  }

  function cleanRecord(item) {
    if (typeof item === "string") {
      const url = normalizeUrl(item);
      return url ? {
        id: makeId(), url, date: "", conversation: "Backup importado",
        favorite: false, visited: false
      } : null;
    }

    if (!item || typeof item !== "object") return null;

    const url = normalizeUrl(item.url || item.link || item.href || "");
    if (!url) return null;

    return {
      id: String(item.id || makeId()),
      url,
      date: String(item.date || item.timestamp || item.datetime || ""),
      conversation: String(item.conversation || item.chat || item.tag || "Backup importado"),
      favorite: Boolean(item.favorite || item.favorited),
      visited: Boolean(item.visited)
    };
  }

  function duplicateKey(item) {
    return `${item.url}\n${item.date}\n${item.conversation}`;
  }

  function mergeLinks(imported) {
    const existing = new Set(links.map(duplicateKey));
    let added = 0;

    for (const raw of imported) {
      const item = cleanRecord(raw);
      if (!item) continue;
      const key = duplicateKey(item);
      if (existing.has(key)) continue;
      existing.add(key);
      links.push(item);
      added++;
    }

    saveLinks();
    return added;
  }

  function getTimestamp(dateString) {
    if (!dateString) return 0;
    const timestamp = Date.parse(dateString);
    return Number.isNaN(timestamp) ? 0 : timestamp;
  }

  function getDomain(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch {
      return url;
    }
  }

  function renderConversationOptions() {
    const selected = conversationFilter.value;
    const conversations = [...new Set(
      links.map(item => item.conversation).filter(Boolean)
    )].sort((a, b) => a.localeCompare(b));

    conversationFilter.replaceChildren(new Option("Todas as conversas", ""));
    for (const conversation of conversations) {
      conversationFilter.add(new Option(conversation, conversation));
    }
    conversationFilter.value = conversations.includes(selected) ? selected : "";
  }

  function render() {
    renderConversationOptions();

    const query = searchElement.value.trim().toLowerCase();
    const selectedConversation = conversationFilter.value;
    const counts = new Map();

    for (const item of links) {
      counts.set(item.url, (counts.get(item.url) || 0) + 1);
    }

    let visible = links.filter(item => {
      if (selectedConversation && item.conversation !== selectedConversation) return false;

      const searchable = `${item.url} ${getDomain(item.url)} ${item.conversation}`.toLowerCase();
      if (query && !searchable.includes(query)) return false;

      if (currentFilter === "favorites" && !item.favorite) return false;
      if (currentFilter === "unvisited" && item.visited) return false;
      if (currentFilter === "repeated" && counts.get(item.url) < 2) return false;

      return true;
    });

    if (sortOrder.value === "oldest") {
      visible.sort((a, b) => getTimestamp(a.date) - getTimestamp(b.date));
    } else if (sortOrder.value === "domain") {
      visible.sort((a, b) => getDomain(a.url).localeCompare(getDomain(b.url)));
    } else {
      visible.sort((a, b) => getTimestamp(b.date) - getTimestamp(a.date));
    }

    linksElement.replaceChildren();

    if (!visible.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = links.length
        ? "Nenhum link corresponde à busca ou aos filtros."
        : "Ainda não há links. Importe uma conversa exportada do WhatsApp.";
      linksElement.appendChild(empty);
      return;
    }

    for (const item of visible) {
      const card = document.createElement("article");
      card.className = "link-card";

      const top = document.createElement("div");
      top.className = "link-top";

      const info = document.createElement("div");
      const anchor = document.createElement("a");
      anchor.className = "domain-link";
      anchor.href = item.url;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.textContent = `🔗 ${getDomain(item.url)}`;
      anchor.title = item.url;
      anchor.dataset.previewUrl = item.url;
      anchor.addEventListener("click", () => {
        item.visited = true;
        saveLinks();
        setTimeout(render, 100);
      });

      const fullUrl = document.createElement("div");
      fullUrl.className = "full-url";
      fullUrl.textContent = item.url;

      const conversation = document.createElement("div");
      conversation.className = "conversation";
      conversation.textContent = `Conversa: ${item.conversation || "Sem nome"}`;

      const date = document.createElement("div");
      date.className = "date";
      date.textContent = item.date
        ? `Data: ${formatDate(item.date)}`
        : "Data não identificada";

      info.append(anchor, fullUrl, conversation, date);

      const actions = document.createElement("div");
      actions.className = "actions";

      const favoriteButton = document.createElement("button");
      favoriteButton.className = "secondary";
      favoriteButton.type = "button";
      favoriteButton.textContent = item.favorite ? "★ Favorito" : "☆ Favoritar";
      favoriteButton.setAttribute("aria-pressed", String(item.favorite));
      favoriteButton.addEventListener("click", () => {
        item.favorite = !item.favorite;
        saveLinks();
        render();
      });

      const removeButton = document.createElement("button");
      removeButton.className = "secondary";
      removeButton.type = "button";
      removeButton.textContent = "Remover";
      removeButton.addEventListener("click", () => removeItem(item.id));

      actions.append(favoriteButton, removeButton);
      top.append(info, actions);
      card.appendChild(top);
      linksElement.appendChild(card);
    }
  }

  function formatDate(value) {
    const timestamp = getTimestamp(value);
    if (!timestamp) return value;
    return new Intl.DateTimeFormat("pt-BR", {
      dateStyle: "short",
      timeStyle: "short"
    }).format(new Date(timestamp));
  }

  function removeItem(id) {
    const index = links.findIndex(item => item.id === id);
    if (index < 0) return;

    deletedLink = { item: links[index], index };
    links.splice(index, 1);
    saveLinks();
    render();

    undoBar.style.display = "block";
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      undoBar.style.display = "none";
      deletedLink = null;
    }, 8000);
  }

  document.getElementById("undoButton").addEventListener("click", () => {
    if (!deletedLink) return;
    links.splice(deletedLink.index, 0, deletedLink.item);
    deletedLink = null;
    clearTimeout(undoTimer);
    undoBar.style.display = "none";
    saveLinks();
    render();
  });

  document.getElementById("txtFile").addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;

    try {
      const text = await file.text();
      addChatText(text, file.name.replace(/\.txt$/i, ""));
    } catch (error) {
      setStatus("Não foi possível ler esse arquivo .txt.");
    }
    event.target.value = "";
  });

  document.getElementById("jsonFile").addEventListener("change", async event => {
    const file = event.target.files[0];
    if (!file) return;

    try {
      const parsed = JSON.parse(await file.text());
      let imported;

      if (Array.isArray(parsed)) {
        imported = parsed;
      } else if (parsed && typeof parsed === "object") {
        imported = parsed.links || parsed.items || parsed.data || [];
      } else {
        imported = [];
      }

      if (!Array.isArray(imported)) {
        throw new Error("Formato JSON não reconhecido.");
      }

      const replace = confirm(
        "OK: substituir os links atuais pelo conteúdo do arquivo.\n" +
        "Cancelar: mesclar e manter os links atuais."
      );

      if (replace) {
        links = [];
        mergeLinks(imported);
        setStatus(`Backup importado: ${links.length} link(s).`);
      } else {
        const added = mergeLinks(imported);
        setStatus(`Backup mesclado: ${added} link(s) novo(s).`);
      }

      render();
    } catch (error) {
      setStatus("Não foi possível importar o JSON. Verifique o formato do arquivo.");
    }

    event.target.value = "";
  });

  document.getElementById("exportButton").addEventListener("click", () => {
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      links
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {
      type: "application/json"
    });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = "backup-links-whatsapp.json";
    anchor.click();
    URL.revokeObjectURL(url);
    setStatus("Backup JSON exportado.");
  });

  document.getElementById("clearButton").addEventListener("click", () => {
    if (!links.length) {
      setStatus("Não há links para apagar.");
      return;
    }

    if (!confirm("Apagar todos os links salvos neste navegador? Exporte um backup antes, se quiser guardá-los.")) {
      return;
    }

    links = [];
    saveLinks();
    render();
    setStatus("Todos os links foram apagados deste navegador.");
  });

  searchElement.addEventListener("input", render);
  conversationFilter.addEventListener("change", render);
  sortOrder.addEventListener("change", render);

  document.querySelectorAll(".filter-button").forEach(button => {
    button.addEventListener("click", () => {
      currentFilter = button.dataset.filter;
      document.querySelectorAll(".filter-button").forEach(item => {
        item.classList.toggle("active", item === button);
      });
      render();
    });
  });

  // Cartão de pré-visualização local: não busca título, imagem ou conteúdo do site.
  const hoverCard = document.createElement("div");
  hoverCard.className = "link-hover-card";
  hoverCard.setAttribute("role", "tooltip");
  document.body.appendChild(hoverCard);

  document.addEventListener("mouseover", event => {
    const link = event.target.closest("a[data-preview-url]");
    if (!link) return;

    try {
      const url = new URL(link.dataset.previewUrl);
      hoverCard.replaceChildren();

      const domain = document.createElement("div");
      domain.className = "preview-domain";
      domain.textContent = `🔗 ${url.hostname.replace(/^www\./, "")}`;

      const fullUrl = document.createElement("div");
      fullUrl.className = "preview-url";
      fullUrl.textContent = link.dataset.previewUrl;

      hoverCard.append(domain, fullUrl);
      hoverCard.classList.add("visible");
    } catch {
      hoverCard.classList.remove("visible");
    }
  });

  document.addEventListener("mousemove", event => {
    if (!hoverCard.classList.contains("visible")) return;

    const gap = 14;
    const width = hoverCard.offsetWidth;
    const height = hoverCard.offsetHeight;
    let left = event.clientX + gap;
    let top = event.clientY + gap;

    if (left + width > window.innerWidth) left = event.clientX - width - gap;
    if (top + height > window.innerHeight) top = event.clientY - height - gap;

    hoverCard.style.left = `${Math.max(8, left)}px`;
    hoverCard.style.top = `${Math.max(8, top)}px`;
  });

  document.addEventListener("mouseout", event => {
    if (event.target.closest("a[data-preview-url]")) {
      hoverCard.classList.remove("visible");
    }
  });

  render();
})();
</script>
</body>
</html>
