<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links do WhatsApp</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --surface: #fff;
      --text: #202124;
      --muted: #687078;
      --line: #e5e7e9;
      --accent: #167d62;
      --accent-light: #e8f4f0;
      --danger: #b42318;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 20px 16px;
    }

    .top, main {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -.02em;
    }

    main { padding: 24px 16px 80px; }

    .panel, .link-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .panel {
      padding: 16px;
      margin-bottom: 18px;
    }

    .actions, .filters, .card-top, .card-bottom {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filters { margin-top: 12px; }

    input, select, button, .file-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      padding: 8px 11px;
    }

    input:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 3px solid #b8e0d3;
      outline-offset: 1px;
    }

    button, .file-button { cursor: pointer; }
    button:hover, .file-button:hover { background: #f7f8f8; }

    button.primary {
      color: white;
      background: var(--accent);
      border-color: var(--accent);
    }

    button.primary:hover { background: #126b54; }

    .file-button {
      display: inline-flex;
      align-items: center;
    }

    .file-button input { display: none; }
    #search { flex: 1 1 220px; }
    #list { display: grid; gap: 10px; }
    .link-card { padding: 14px; }
    .card-top { justify-content: space-between; }

    .conversation {
      color: var(--muted);
      font-size: .88rem;
      overflow-wrap: anywhere;
    }

    .link {
      display: block;
      margin: 10px 0;
      color: var(--accent);
      font-weight: 600;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .link:hover { text-decoration: underline; }

    .card-bottom {
      justify-content: space-between;
      color: var(--muted);
      font-size: .85rem;
    }

    .card-buttons { display: flex; gap: 6px; }

    .card-buttons button {
      min-height: 34px;
      padding: 5px 9px;
      font-size: .88rem;
    }

    .favorite { color: #9a6700; }
    .visited { opacity: .65; }
    .visited .link { font-weight: 400; }

    #status, #count, .hint {
      color: var(--muted);
      font-size: .9rem;
    }

    #count { margin: 0 0 10px; }
    .hint { margin: 10px 0 0; }

    #undoBar {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, calc(100% - 24px));
      padding: 12px 14px;
      background: #222;
      color: white;
      border-radius: 10px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 6px 24px #0003;
    }

    #undoBar button {
      color: white;
      background: transparent;
      border-color: #777;
    }

    #empty {
      padding: 32px 12px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 560px) {
      header { padding: 16px 12px; }
      main { padding: 16px 12px 80px; }
      .top { align-items: flex-start; flex-direction: column; }
      .top .actions { justify-content: flex-start; }
      .panel { padding: 12px; }
      .filters > * { flex: 1 1 130px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>Links do WhatsApp</h1>
      <div class="actions">
        <label class="file-button">
          Importar .txt
          <input id="txtInput" type="file" accept=".txt,text/plain" multiple>
        </label>
        <button id="exportButton" type="button">Exportar JSON</button>
        <label class="file-button">
          Importar JSON
          <input id="jsonInput" type="file" accept=".json,application/json">
        </label>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="Busca e filtros">
      <input id="search" type="search" placeholder="Buscar link ou conversa…" aria-label="Buscar">
      <div class="filters">
        <select id="filter" aria-label="Filtrar links">
          <option value="all">Todos os links</option>
          <option value="favorites">Favoritos</option>
          <option value="unvisited">Não visitados</option>
          <option value="repeated">Repetidos</option>
        </select>
        <select id="sort" aria-label="Ordenar links">
          <option value="newest">Mais recentes</option>
          <option value="oldest">Mais antigos</option>
          <option value="conversation">Conversa (A–Z)</option>
          <option value="url">Link (A–Z)</option>
        </select>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
      <p class="hint">Os dados ficam salvos neste navegador. Exporte um JSON para criar um backup ou transferir os dados.</p>
    </section>

    <p id="count"></p>
    <section id="list" aria-live="polite"></section>
    <div id="empty" hidden>Nenhum link encontrado.</div>
  </main>

  <div id="undoBar" role="status">
    <span>Link removido.</span>
    <button id="undoButton" type="button">Desfazer</button>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "whatsapp-links-v1";
      const $ = selector => document.querySelector(selector);
      const listEl = $("#list");

      let links = loadLinks();
      let undoItem = null;
      let undoTimer = null;

      function loadLinks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved) ? saved.filter(isValidLink).map(normalizeItem) : [];
        } catch {
          showStatus("Não foi possível ler os dados salvos. Importe seu backup JSON, se tiver um.");
          return [];
        }
      }

      function isValidLink(item) {
        if (!item || typeof item.url !== "string") return false;

        try {
          const url = new URL(item.url);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function normalizeItem(item) {
        return {
          id: typeof item.id === "string" ? item.id : makeId(),
          url: item.url,
          conversation: typeof item.conversation === "string" && item.conversation.trim()
            ? item.conversation.trim()
            : "Conversa sem nome",
          favorite: Boolean(item.favorite),
          visited: Boolean(item.visited),
          createdAt: Number.isFinite(Number(item.createdAt)) ? Number(item.createdAt) : Date.now()
        };
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
          return true;
        } catch (error) {
          console.error("Falha ao salvar links:", error);
          showStatus("Não foi possível salvar. Exporte um backup e libere espaço no navegador.");
          return false;
        }
      }

      function makeId() {
        return globalThis.crypto?.randomUUID?.() ||
          `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function showStatus(message) {
        const status = $("#status");
        status.textContent = message;
        window.setTimeout(() => {
          if (status.textContent === message) status.textContent = "";
        }, 7000);
      }

      function cleanUrl(raw) {
        return raw.replace(/[<>"'“”‘’.,!?;:)\]}]+$/g, "");
      }

      function extractUrls(text) {
        const found = text.match(/https?:\/\/[^\s<>"']+/gi) || [];
        return [...new Set(found.map(cleanUrl).filter(isValidUrl))];
      }

      function isValidUrl(value) {
        try {
          const url = new URL(value);
          return url.protocol === "http:" || url.protocol === "https:";
        } catch {
          return false;
        }
      }

      function normalizeUrl(value) {
        try {
          const url = new URL(value);
          url.hash = "";
          return url.href.replace(/\/$/, "").toLowerCase();
        } catch {
          return value.trim().toLowerCase();
        }
      }

      function getConversationFromLine(line) {
        // Formato: [12/03/2025, 14:30] Nome: mensagem
        // Formato: 12/03/2025, 14:30 - Nome: mensagem
        const patterns = [
          /^\[(?:\d{1,4}[\/.-]){2}\d{1,4},?\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s?[AP]M)?\]\s*([^:]+):/i,
          /^(?:\d{1,4}[\/.-]){2}\d{1,4},?\s+\d{1,2}:\d{2}(?::\d{2})?(?:\s?[AP]M)?\s+-\s+([^:]+):/i
        ];

        for (const pattern of patterns) {
          const match = line.match(pattern);
          if (match?.[1]) return match[1].trim();
        }
        return null;
      }

      function getFallbackConversation(filename) {
        const name = filename.replace(/\.txt$/i, "").trim();
        return name || "Conversa sem nome";
      }

      async function importTxt(files) {
        let added = 0;
        let skipped = 0;
        let withoutConversationFormat = 0;

        for (const file of files) {
          const text = await file.text();
          const fallbackConversation = getFallbackConversation(file.name);

          for (const line of text.split(/\r?\n/)) {
            const detectedConversation = getConversationFromLine(line);
            const conversation = detectedConversation || fallbackConversation;

            if (!detectedConversation && extractUrls(line).length) {
              withoutConversationFormat++;
            }

            for (const url of extractUrls(line)) {
              const key = normalizeUrl(url);

              if (links.some(item => normalizeUrl(item.url) === key)) {
                skipped++;
                continue;
              }

              links.push({
                id: makeId(),
                url,
                conversation,
                favorite: false,
                visited: false,
                createdAt: Date.now()
              });
              added++;
            }
          }
        }

        if (save()) {
          render();
          let message = `${added} link(s) importado(s); ${skipped} duplicado(s) ignorado(s).`;
          if (withoutConversationFormat) {
            message += ` ${withoutConversationFormat} link(s) usaram o nome do arquivo como conversa.`;
          }
          showStatus(message);
        }
      }

      function render() {
        const query = $("#search").value.trim().toLowerCase();
        const filter = $("#filter").value;
        const sort = $("#sort").value;
        const counts = new Map();

        for (const item of links) {
          const key = normalizeUrl(item.url);
          counts.set(key, (counts.get(key) || 0) + 1);
        }

        let shown = links.filter(item => {
          const matchesQuery =
            !query ||
            item.url.toLowerCase().includes(query) ||
            item.conversation.toLowerCase().includes(query);

          if (!matchesQuery) return false;
          if (filter === "favorites" && !item.favorite) return false;
          if (filter === "unvisited" && item.visited) return false;
          if (filter === "repeated" && (counts.get(normalizeUrl(item.url)) || 0) < 2) return false;
          return true;
        });

        shown.sort((a, b) => {
          if (sort === "oldest") return a.createdAt - b.createdAt;
          if (sort === "conversation") return a.conversation.localeCompare(b.conversation);
          if (sort === "url") return a.url.localeCompare(b.url);
          return b.createdAt - a.createdAt;
        });

        listEl.replaceChildren();
        $("#count").textContent = `${shown.length} de ${links.length} link(s)`;

        for (const item of shown) {
          const card = document.createElement("article");
          card.className = `link-card${item.visited ? " visited" : ""}`;

          const top = document.createElement("div");
          top.className = "card-top";

          const conversation = document.createElement("span");
          conversation.className = "conversation";
          conversation.textContent = item.conversation;

          top.append(conversation);

          if ((counts.get(normalizeUrl(item.url)) || 0) > 1) {
            const repeated = document.createElement("span");
            repeated.className = "conversation";
            repeated.textContent = "Repetido";
            top.append(repeated);
          }

          const anchor = document.createElement("a");
          anchor.className = "link";
          anchor.href = item.url;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.textContent = item.url;

          anchor.addEventListener("click", () => {
            item.visited = true;
            save();
            window.setTimeout(render, 0);
          });

          const bottom = document.createElement("div");
          bottom.className = "card-bottom";

          const date = document.createElement("span");
          date.textContent = item.visited ? "Visitado" : "Não visitado";

          const buttons = document.createElement("div");
          buttons.className = "card-buttons";

          const favorite = document.createElement("button");
          favorite.type = "button";
          favorite.className = item.favorite ? "favorite" : "";
          favorite.textContent = item.favorite ? "★ Favorito" : "☆ Favorito";
          favorite.setAttribute("aria-pressed", String(item.favorite));
          favorite.addEventListener("click", () => {
            item.favorite = !item.favorite;
            if (save()) render();
          });

          const visited = document.createElement("button");
          visited.type = "button";
          visited.textContent = item.visited ? "Marcar não visitado" : "Marcar visitado";
          visited.addEventListener("click", () => {
            item.visited = !item.visited;
            if (save()) render();
          });

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Remover";
          remove.addEventListener("click", () => removeLink(item.id));

          buttons.append(favorite, visited, remove);
          bottom.append(date, buttons);
          card.append(top, anchor, bottom);
          listEl.append(card);
        }

        $("#empty").hidden = shown.length > 0;
      }

      function removeLink(id) {
        const index = links.findIndex(item => item.id === id);
        if (index < 0) return;

        undoItem = { item: links[index], index };
        links.splice(index, 1);

        if (!save()) {
          links.splice(index, 0, undoItem.item);
          undoItem = null;
          return;
        }

        render();
        $("#undoBar").style.display = "flex";

        clearTimeout(undoTimer);
        undoTimer = window.setTimeout(() => {
          $("#undoBar").style.display = "none";
          undoItem = null;
        }, 6000);
      }

      $("#undoButton").addEventListener("click", () => {
        if (!undoItem) return;

        links.splice(Math.min(undoItem.index, links.length), 0, undoItem.item);
        if (save()) {
          undoItem = null;
          clearTimeout(undoTimer);
          $("#undoBar").style.display = "none";
          render();
        }
      });

      $("#txtInput").addEventListener("change", async event => {
        const files = [...event.target.files];
        if (!files.length) return;

        try {
          await importTxt(files);
        } catch (error) {
          console.error("Falha ao importar TXT:", error);
          showStatus("Não foi possível ler um dos arquivos TXT.");
        }

        event.target.value = "";
      });

      $("#exportButton").addEventListener("click", () => {
        try {
          const blob = new Blob([JSON.stringify(links, null, 2)], {
            type: "application/json"
          });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = "backup-links-whatsapp.json";
          anchor.click();
          URL.revokeObjectURL(url);
          showStatus("Backup JSON exportado.");
        } catch (error) {
          console.error("Falha ao exportar JSON:", error);
          showStatus("Não foi possível exportar o backup.");
        }
      });

      function prepareImportedLinks(data) {
        if (!Array.isArray(data)) {
          throw new Error("O arquivo JSON precisa conter uma lista de links.");
        }

        const unique = new Map();

        for (const rawItem of data) {
          if (!isValidLink(rawItem)) continue;

          const item = normalizeItem(rawItem);
          const key = normalizeUrl(item.url);

          // Elimina duplicatas dentro do próprio arquivo JSON.
          if (!unique.has(key)) unique.set(key, item);
        }

        return [...unique.values()];
      }

      function importJson(items, mode) {
        if (mode === "replace") {
          const previous = links;
          links = items.map(item => ({ ...item, id: makeId() }));

          if (!save()) {
            links = previous;
            return;
          }

          render();
          showStatus(`${items.length} link(s) importado(s). A lista anterior foi substituída.`);
          return;
        }

        const merged = [...links];
        const seen = new Set(merged.map(item => normalizeUrl(item.url)));
        let added = 0;
        let skipped = 0;

        for (const item of items) {
          const key = normalizeUrl(item.url);

          if (seen.has(key)) {
            skipped++;
            continue;
          }

          merged.push({ ...item, id: makeId() });
          seen.add(key);
          added++;
        }

        const previous = links;
        links = merged;

        if (!save()) {
          links = previous;
          return;
        }

        render();
        showStatus(`${added} link(s) adicionado(s); ${skipped} duplicado(s) ignorado(s).`);
      }

      $("#jsonInput").addEventListener("change", async event => {
        const file = event.target.files[0];
        if (!file) return;

        try {
          const parsed = JSON.parse(await file.text());
          const imported = prepareImportedLinks(parsed);

          if (!imported.length) {
            showStatus("O JSON não contém links válidos. A lista atual não foi alterada.");
            return;
          }

          const mode = window.prompt(
            `Foram encontrados ${imported.length} link(s) válidos.\n\n` +
            "Digite M para mesclar com os links atuais.\n" +
            "Digite S para substituir todos os links atuais.\n" +
            "Cancele para não importar."
          );

          if (mode === null) return;

          const choice = mode.trim().toLowerCase();

          if (choice === "m") {
            importJson(imported, "merge");
          } else if (choice === "s") {
            const confirmed = window.confirm(
              "Isso substituirá a lista atual. Faça um backup antes, se necessário. Continuar?"
            );
            if (confirmed) importJson(imported, "replace");
          } else {
            showStatus("Importação cancelada: escolha M para mesclar ou S para substituir.");
          }
        } catch (error) {
          console.error("Falha ao importar JSON:", error);
          showStatus("Arquivo JSON inválido ou impossível de ler. A lista atual não foi alterada.");
        }

        event.target.value = "";
      });

      $("#search").addEventListener("input", render);
      $("#filter").addEventListener("change", render);
      $("#sort").addEventListener("change", render);

      render();
    })();
  </script>
</body>
</html>
