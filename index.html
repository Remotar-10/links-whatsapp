<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links do WhatsApp</title>
  <style>
    :root {
      color-scheme: light;
      --green: #128c7e;
      --green-dark: #0b6b60;
      --background: #f4f7f6;
      --surface: #fff;
      --text: #202624;
      --muted: #68736f;
      --border: #dce4e1;
      --shadow: 0 3px 12px rgb(0 0 0 / 7%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header { margin-bottom: 22px; }

    h1 {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
    }

    .count {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .toolbar, .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
    }

    button, .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 39px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .file-label:hover { background: #eef4f1; }

    button.primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    button.primary:hover { background: var(--green-dark); }

    button.active {
      border-color: var(--green);
      color: var(--green-dark);
      background: #e7f4f0;
    }

    input[type="file"] { display: none; }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(170px, 240px);
      gap: 10px;
      margin-bottom: 16px;
    }

    .controls input, .controls select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--text);
    }

    .links { display: grid; gap: 12px; }

    .card {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .85rem;
    }

    .url {
      color: var(--green-dark);
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .url:hover { text-decoration: underline; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      min-height: 34px;
      padding: 5px 10px;
      font-size: .9rem;
    }

    .favorite { color: #a66a00; }

    .empty {
      padding: 28px 16px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }

    .message {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      max-width: min(480px, calc(100vw - 32px));
      padding: 12px 15px;
      border-radius: 9px;
      background: #20332d;
      color: white;
      box-shadow: var(--shadow);
    }

    .message[hidden] { display: none; }

    .message button {
      min-height: auto;
      margin-left: 8px;
      padding: 3px 8px;
      border-color: #ffffff80;
      background: transparent;
      color: white;
    }

    .preview {
      position: fixed;
      z-index: 30;
      display: none;
      width: min(380px, calc(100vw - 24px));
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      box-shadow: 0 8px 28px rgb(0 0 0 / 18%);
      pointer-events: none;
    }

    .preview strong, .preview span {
      display: block;
      overflow-wrap: anywhere;
    }

    .preview span {
      margin-top: 4px;
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 22px, 900px); padding-top: 20px; }
      .controls { grid-template-columns: 1fr; }
      .card { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>Links do WhatsApp</h1>
      <p class="count">Total de links: <strong id="linkCount">0</strong></p>
    </header>

    <section class="toolbar" aria-label="Importar e exportar">
      <label class="file-label primary" for="txtInput">Importar conversa .txt</label>
      <input id="txtInput" type="file" accept=".txt,text/plain">

      <button type="button" id="exportButton">Exportar JSON</button>
      <label class="file-label" for="jsonInput">Importar JSON</label>
      <input id="jsonInput" type="file" accept=".json,application/json">
      <button type="button" id="clearButton">Apagar todos</button>
    </section>

    <section class="controls">
      <input id="searchInput" type="search" placeholder="Buscar por link ou conversa…" aria-label="Buscar">
      <select id="conversationFilter" aria-label="Filtrar por conversa">
        <option value="">Todas as conversas</option>
      </select>
    </section>

    <section class="filters" aria-label="Filtros">
      <button type="button" class="filter-button active" data-filter="all">Todos</button>
      <button type="button" class="filter-button" data-filter="favorites">Favoritos</button>
      <button type="button" class="filter-button" data-filter="unvisited">Não visitados</button>
      <button type="button" class="filter-button" data-filter="repeated">Repetidos</button>
    </section>

    <div id="linksContainer" class="links"></div>
  </main>

  <div id="message" class="message" role="status" hidden></div>
  <div id="preview" class="preview" aria-hidden="true">
    <strong id="previewDomain"></strong>
    <span id="previewUrl"></span>
  </div>

  <script>
    "use strict";

    const STORAGE_KEY = "whatsappLinks";
    let allLinks = loadStoredLinks();
    let currentFilter = "all";
    let undoLink = null;
    let messageTimer;

    const countElement = document.getElementById("linkCount");
    const linksContainer = document.getElementById("linksContainer");
    const searchInput = document.getElementById("searchInput");
    const conversationFilter = document.getElementById("conversationFilter");
    const messageElement = document.getElementById("message");
    const previewElement = document.getElementById("preview");

    function loadStoredLinks() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch (error) {
        console.error("Não foi possível ler os dados salvos:", error);
        return [];
      }
    }

    function saveLinks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allLinks));
        return true;
      } catch (error) {
        showMessage("Não foi possível salvar. Exporte os dados ou libere espaço no navegador.");
        console.error("Erro ao salvar:", error);
        return false;
      }
    }

    function makeId() {
      return (globalThis.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function normalizeUrl(value) {
      try {
        const url = new URL(String(value));
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch {
        return null;
      }
    }

    function dateTimestamp(value) {
      if (!value) return 0;
      const timestamp = new Date(value).getTime();
      return Number.isFinite(timestamp) ? timestamp : 0;
    }

    function sortLinks() {
      allLinks.sort((a, b) => dateTimestamp(b.date) - dateTimestamp(a.date));
    }

    function formatDate(value) {
      if (!value) return "Data não identificada";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return new Intl.DateTimeFormat("pt-BR", {
        dateStyle: "short",
        timeStyle: "short"
      }).format(date);
    }

    function updateCount() {
      countElement.textContent = String(allLinks.length);
    }

    function updateConversationOptions() {
      const selected = conversationFilter.value;
      const names = [...new Set(allLinks.map(link => link.conversation).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "pt-BR"));

      conversationFilter.replaceChildren(new Option("Todas as conversas", ""));
      for (const name of names) {
        conversationFilter.add(new Option(name, name));
      }
      conversationFilter.value = names.includes(selected) ? selected : "";
    }

    function render() {
      sortLinks();
      updateCount();
      updateConversationOptions();

      const query = searchInput.value.trim().toLocaleLowerCase("pt-BR");
      const selectedConversation = conversationFilter.value;
      const urlCounts = new Map();

      for (const link of allLinks) {
        const key = (link.url || "").toLowerCase();
        urlCounts.set(key, (urlCounts.get(key) || 0) + 1);
      }

      const visibleLinks = allLinks.filter(link => {
        const conversation = link.conversation || "";
        const matchesQuery = !query ||
          (link.url || "").toLocaleLowerCase("pt-BR").includes(query) ||
          conversation.toLocaleLowerCase("pt-BR").includes(query);
        const matchesConversation = !selectedConversation ||
          conversation === selectedConversation;
        const matchesFilter =
          currentFilter === "all" ||
          (currentFilter === "favorites" && link.favorite) ||
          (currentFilter === "unvisited" && !link.visited) ||
          (currentFilter === "repeated" && (urlCounts.get((link.url || "").toLowerCase()) || 0) > 1);

        return matchesQuery && matchesConversation && matchesFilter;
      });

      linksContainer.replaceChildren();

      if (visibleLinks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = allLinks.length ? "Nenhum link corresponde aos filtros." : "Importe um arquivo .txt ou JSON para começar.";
        linksContainer.append(empty);
        return;
      }

      for (const link of visibleLinks) {
        const card = document.createElement("article");
        card.className = "card";

        const top = document.createElement("div");
        top.className = "card-top";
        const date = document.createElement("time");
        date.textContent = formatDate(link.date);
        if (link.date) date.dateTime = link.date;
        const status = document.createElement("span");
        status.textContent = link.visited ? "Visitado" : "";
        top.append(date, status);

        const anchor = document.createElement("a");
        anchor.className = "url";
        anchor.href = link.url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = link.url;
        anchor.dataset.previewUrl = link.url;

        const actions = document.createElement("div");
        actions.className = "actions";

        const favoriteButton = document.createElement("button");
        favoriteButton.type = "button";
        favoriteButton.className = "favorite";
        favoriteButton.textContent = link.favorite ? "★ Favorito" : "☆ Favorito";
        favoriteButton.setAttribute("aria-pressed", String(Boolean(link.favorite)));
        favoriteButton.addEventListener("click", () => {
          link.favorite = !link.favorite;
          saveLinks();
          render();
        });

        const visitedButton = document.createElement("button");
        visitedButton.type = "button";
        visitedButton.textContent = link.visited ? "✓ Visitado" : "Marcar visitado";
        visitedButton.addEventListener("click", () => {
          link.visited = !link.visited;
          saveLinks();
          render();
        });

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "Remover";
        removeButton.addEventListener("click", () => removeLink(link.id));

        actions.append(favoriteButton, visitedButton, removeButton);
        card.append(top, anchor, actions);
        linksContainer.append(card);
      }
    }

    function showMessage(text, undo = false) {
      clearTimeout(messageTimer);
      messageElement.replaceChildren(document.createTextNode(text));

      if (undo) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Desfazer";
        button.addEventListener("click", restoreRemovedLink, { once: true });
        messageElement.append(button);
      }

      messageElement.hidden = false;
      messageTimer = setTimeout(() => {
        messageElement.hidden = true;
        undoLink = null;
      }, 6000);
    }

    function removeLink(id) {
      const index = allLinks.findIndex(link => link.id === id);
      if (index < 0) return;

      undoLink = { index, link: allLinks[index] };
      allLinks.splice(index, 1);
      saveLinks();
      render();
      showMessage("Link removido.", true);
    }

    function restoreRemovedLink() {
      if (!undoLink) return;
      const index = Math.min(undoLink.index, allLinks.length);
      allLinks.splice(index, 0, undoLink.link);
      undoLink = null;
      saveLinks();
      render();
      showMessage("Remoção desfeita.");
    }

    function extractConversation(text, filename) {
      const patterns = [
        /Chat with\s+(.+)/i,
        /Chat com\s+(.+)/i,
        /Group\s+(.+)/i,
        /Grupo\s+(.+)/i
      ];

      for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) return match[1].trim().replace(/["']/g, "");
      }

      return filename.replace(/\.txt$/i, "") || "Conversa desconhecida";
    }

    function parseWhatsAppDate(line) {
      const match = line.match(
        /^\[?(\d{1,2})[/.](\d{1,2})[/.](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?:\s*([APap][Mm]))?\]?[ -]*/
      );
      if (!match) return null;

      let [, day, month, year, hour, minute, ampm] = match;
      day = Number(day);
      month = Number(month) - 1;
      year = Number(year);
      hour = Number(hour);
      minute = Number(minute);

      if (year < 100) year += year < 70 ? 2000 : 1900;
      if (ampm) {
        const isPM = ampm.toUpperCase() === "PM";
        hour = hour % 12 + (isPM ? 12 : 0);
      }

      const date = new Date(year, month, day, hour, minute);
      return Number.isNaN(date.getTime()) ? null : date.toISOString();
    }

    function extractLinks(text, filename) {
      const conversation = extractConversation(text, filename);
      const results = [];
      const urlPattern = /https?:\/\/[^\s<>"']+/gi;

      for (const line of text.split(/\r?\n/)) {
        const date = parseWhatsAppDate(line);
        const matches = line.match(urlPattern) || [];

        for (let url of matches) {
          url = url.replace(/[.,!?;:)\]}]+$/g, "");
          const normalized = normalizeUrl(url);
          if (!normalized) continue;

          results.push({
            id: makeId(),
            url: normalized,
            date,
            conversation,
            favorite: false,
            visited: false
          });
        }
      }

      return results;
    }

    function addImportedLinks(imported, merge = true) {
      const normalized = imported
        .filter(item => item && typeof item === "object")
        .map(item => {
          const url = normalizeUrl(item.url || item.link || item.href);
          if (!url) return null;
          return {
            id: item.id || makeId(),
            url,
            date: item.date || item.timestamp || null,
            conversation: item.conversation || item.chat || item.tag || "Conversa desconhecida",
            favorite: Boolean(item.favorite),
            visited: Boolean(item.visited)
          };
        })
        .filter(Boolean);

      if (!merge) {
        allLinks = normalized;
      } else {
        const existing = new Set(allLinks.map(link =>
          `${link.url}|${link.date || ""}|${link.conversation || ""}`
        ));
        for (const link of normalized) {
          const key = `${link.url}|${link.date || ""}|${link.conversation || ""}`;
          if (!existing.has(key)) {
            allLinks.push(link);
            existing.add(key);
          }
        }
      }

      saveLinks();
      render();
      return normalized.length;
    }

    document.getElementById("txtInput").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const imported = extractLinks(text, file.name);
        const count = addImportedLinks(imported, true);
        showMessage(`Importação concluída: ${count} links encontrados.`);
      } catch (error) {
        console.error(error);
        showMessage("Não foi possível ler esse arquivo TXT.");
      } finally {
        event.target.value = "";
      }
    });

    document.getElementById("jsonInput").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const data = JSON.parse(await file.text());
        const replace = confirm("OK = substituir os links atuais. Cancelar = mesclar com os links atuais.");
        const imported = Array.isArray(data)
          ? data
          : data.links || data.items || data.data || [];

        if (!Array.isArray(imported)) {
          throw new Error("Formato JSON não reconhecido.");
        }

        const count = addImportedLinks(imported, !replace);
        showMessage(`Importação JSON concluída: ${count} links processados.`);
      } catch (error) {
        console.error(error);
        showMessage("JSON inválido ou formato não reconhecido.");
      } finally {
        event.target.value = "";
      }
    });

    document.getElementById("exportButton").addEventListener("click", () => {
      const blob = new Blob(
        [JSON.stringify({ links: allLinks }, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `links-whatsapp-${new Date().toISOString().slice(0, 10)}.json`;
      anchor.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      if (!confirm("Tem certeza de que deseja apagar todos os links?")) return;
      allLinks = [];
      undoLink = null;
      saveLinks();
      render();
      showMessage("Todos os links foram apagados.");
    });

    searchInput.addEventListener("input", render);
    conversationFilter.addEventListener("change", render);

    document.querySelectorAll(".filter-button").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll(".filter-button").forEach(item =>
          item.classList.toggle("active", item === button)
        );
        render();
      });
    });

    linksContainer.addEventListener("mouseover", event => {
      const anchor = event.target.closest("a[data-preview-url]");
      if (!anchor) return;

      try {
        const url = new URL(anchor.dataset.previewUrl);
        document.getElementById("previewDomain").textContent = url.hostname;
        document.getElementById("previewUrl").textContent = anchor.dataset.previewUrl;
        previewElement.style.display = "block";

        const rect = anchor.getBoundingClientRect();
        const left = Math.min(rect.left, window.innerWidth - previewElement.offsetWidth - 12);
        const top = rect.bottom + 8 + previewElement.offsetHeight < window.innerHeight
          ? rect.bottom + 8
          : Math.max(12, rect.top - previewElement.offsetHeight - 8);

        previewElement.style.left = `${Math.max(12, left)}px`;
        previewElement.style.top = `${top}px`;
      } catch {
        previewElement.style.display = "none";
      }
    });

    linksContainer.addEventListener("mouseout", event => {
      if (event.target.closest("a[data-preview-url]")) {
        previewElement.style.display = "none";
      }
    });

    render();
  </script>
</body>
</html>
